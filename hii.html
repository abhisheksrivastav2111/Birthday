<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Luxury Birthday Surprise ✨</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      cursor:none;
    }

    body{
      overflow:hidden;
      font-family:'Outfit',sans-serif;
      min-height:100vh;
      background:#050816;
      position:relative;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;

      background:
        radial-gradient(circle at top left,#ff4da6 0%,transparent 25%),
        radial-gradient(circle at bottom right,#8b5cf6 0%,transparent 30%),
        radial-gradient(circle at center,#06b6d4 0%,transparent 35%),
        linear-gradient(135deg,#020617,#0f172a,#111827);

      background-size:400% 400%;
      animation:bgMove 18s ease infinite;

      z-index:-10;
    }

    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    /* CURSOR */

    .cursor{

      width:22px;
      height:22px;

      border-radius:50%;

      position:fixed;

      pointer-events:none;

      background:white;

      box-shadow:
        0 0 15px white,
        0 0 35px #ff4da6,
        0 0 60px #8b5cf6;

      transform:translate(-50%,-50%);

      z-index:9999;
    }

    /* PARTICLES */

    .particle{
      position:absolute;
      width:4px;
      height:4px;
      border-radius:50%;
      background:white;
      opacity:.4;
      animation:particleFloat linear infinite;
    }

    @keyframes particleFloat{
      from{
        transform:translateY(100vh);
      }
      to{
        transform:translateY(-120vh);
      }
    }

    /* STARS */

    .star{
      position:absolute;
      background:white;
      border-radius:50%;
      opacity:.7;
      animation:twinkle infinite alternate;
    }

    @keyframes twinkle{
      from{
        opacity:.2;
        transform:scale(.7);
      }

      to{
        opacity:1;
        transform:scale(1.2);
      }
    }

    /* LIGHTS */

    .circle{
      position:absolute;
      border-radius:50%;
      filter:blur(100px);
      opacity:.18;
      animation:floatCircle 12s ease-in-out infinite alternate;
    }

    .circle1{
      width:300px;
      height:300px;
      background:#ff4da6;
      top:-100px;
      left:-100px;
    }

    .circle2{
      width:350px;
      height:350px;
      background:#8b5cf6;
      bottom:-120px;
      right:-120px;
    }

    .circle3{
      width:250px;
      height:250px;
      background:#06b6d4;
      top:40%;
      left:45%;
    }

    @keyframes floatCircle{
      from{
        transform:translateY(0px) translateX(0px);
      }

      to{
        transform:translateY(60px) translateX(40px);
      }
    }

    /* RIBBON */

    .ribbon{
      position:absolute;
      top:0;
      width:100%;
      height:70px;

      display:flex;
      justify-content:center;
      align-items:center;

      background:rgba(255,255,255,.05);

      backdrop-filter:blur(14px);

      border-bottom:1px solid rgba(255,255,255,.08);

      color:white;

      font-size:28px;

      letter-spacing:8px;

      font-family:'Cormorant Garamond',serif;

      z-index:20;
    }

    /* NAME */

    .floating-name{

      position:absolute;

      top:100px;
      width:100%;

      text-align:center;

      font-size:42px;

      color:white;

      font-family:'Cormorant Garamond',serif;

      animation:nameFloat 4s ease-in-out infinite;

      text-shadow:
        0 0 20px rgba(255,255,255,.35);
    }

    @keyframes nameFloat{

      0%,100%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-10px);
      }
    }

    /* MAIN */

    .scene{
      width:100%;
      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      position:relative;
      overflow:hidden;
    }

    /* CARD */

    .card{
      width:500px;

      padding:55px;

      background:rgba(255,255,255,.06);

      border:1px solid rgba(255,255,255,.12);

      backdrop-filter:blur(24px);

      border-radius:36px;

      text-align:center;

      position:relative;

      overflow:hidden;

      box-shadow:
        0 0 30px rgba(255,255,255,.05),
        0 0 80px rgba(255,77,166,.18),
        0 0 120px rgba(139,92,246,.12);

      animation:cardAppear 1s ease;
    }

    @keyframes cardAppear{
      from{
        transform:translateY(40px) scale(.92);
        opacity:0;
      }

      to{
        transform:translateY(0px) scale(1);
        opacity:1;
      }
    }

    .step{
      display:inline-block;

      padding:8px 18px;

      border-radius:100px;

      background:rgba(255,255,255,.08);

      color:white;

      font-size:12px;

      letter-spacing:2px;

      margin-bottom:22px;
    }

    .emoji{
      font-size:85px;
      margin-bottom:18px;
      animation:pulse 2.5s infinite;
    }

    @keyframes pulse{

      0%,100%{
        transform:scale(1);
      }

      50%{
        transform:scale(1.12);
      }
    }

    .title{
      font-size:54px;
      color:white;

      margin-bottom:18px;

      line-height:1.1;

      font-family:'Cormorant Garamond',serif;
    }

    .desc{
      color:#d1d5db;

      line-height:2;

      font-size:15px;

      margin-bottom:32px;
    }

    button{
      width:100%;

      padding:18px;

      border:none;

      border-radius:100px;

      background:
        linear-gradient(
          135deg,
          #ff4da6,
          #ff85c1,
          #8b5cf6
        );

      color:white;

      font-size:15px;

      font-weight:600;

      transition:.4s;
    }

    button:hover{
      transform:translateY(-5px) scale(1.03);
    }

    /* PHOTOS */

    .photo{

      position:absolute;

      width:180px;
      height:240px;

      background:
        rgba(255,255,255,.08);

      padding:10px;

      border-radius:28px;

      overflow:hidden;

      border:
        1.5px solid rgba(255,255,255,.18);

      backdrop-filter:blur(18px);

      box-shadow:
        0 25px 50px rgba(0,0,0,.45);

      animation:
        photoFall linear forwards;

      z-index:2;
    }

    .photo img{

      width:100%;
      height:100%;

      object-fit:cover;

      border-radius:18px;
    }

    @keyframes photoFall{

      0%{
        transform:
          translateY(-180vh)
          rotate(-35deg)
          scale(.5);

        opacity:0;
      }

      10%{
        opacity:1;
      }

      100%{
        transform:
          translateY(150vh)
          rotate(35deg)
          scale(1.1);

        opacity:0;
      }
    }

    /* FLOWERS */

    .flower{

      position:absolute;

      top:-100px;

      font-size:32px;

      z-index:1;

      animation:flowerFall linear forwards;
    }

    @keyframes flowerFall{

      0%{
        transform:
          translateY(-100px)
          rotate(0deg);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      100%{
        transform:
          translateY(120vh)
          rotate(360deg);

        opacity:0;
      }
    }

    /* BALLOONS */

    .balloon{
      position:absolute;
      bottom:-120px;
      font-size:40px;
      animation:balloonFly linear forwards;
      z-index:1;
    }

    @keyframes balloonFly{
      0%{
        transform:translateY(0);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      100%{
        transform:translateY(-130vh);
        opacity:0;
      }
    }

    /* BUTTERFLY */

    .butterfly{
      position:absolute;
      z-index:3;
      animation:butterflyMove linear forwards;
    }

    @keyframes butterflyMove{

      0%{
        transform:
          translateX(0)
          translateY(0);
      }

      100%{
        transform:
          translateX(120vw)
          translateY(-120px);
      }
    }

    /* PREMIUM REALISTIC CAKE */

    .cake-effect{

      position:absolute;

      bottom:40px;
      right:40px;

      width:180px;
      height:220px;

      z-index:4;

      opacity:0;

      transform:
        scale(.5)
        rotate(-15deg);

      transition:1.2s ease;
    }

    .cake-effect.show{

      opacity:1;

      transform:
        scale(1)
        rotate(0deg);
    }

    .cake-body{

      position:absolute;

      bottom:0;

      width:180px;
      height:90px;

      border-radius:0 0 30px 30px;

      background:
        linear-gradient(
          135deg,
          #ff85c1,
          #ff4da6
        );

      box-shadow:
        0 0 30px rgba(255,105,180,.35);
    }

    .cake-layer{

      position:absolute;

      bottom:70px;
      left:20px;

      width:140px;
      height:60px;

      border-radius:20px 20px 10px 10px;

      background:
        linear-gradient(
          135deg,
          #fff0f5,
          #ffd6eb
        );
    }

    .cake-candle{

      position:absolute;

      bottom:120px;
      left:82px;

      width:16px;
      height:50px;

      border-radius:10px;

      background:
        repeating-linear-gradient(
          45deg,
          white 0 8px,
          #ff4da6 8px 16px
        );
    }

    .flame{

      position:absolute;

      bottom:168px;
      left:75px;

      width:30px;
      height:40px;

      background:
        radial-gradient(
          circle,
          #fff7a8 0%,
          #ffcc00 40%,
          #ff7b00 70%
        );

      border-radius:
        50% 50% 50% 50% /
        60% 60% 40% 40%;

      filter:
        blur(.5px)
        drop-shadow(0 0 20px orange);

      animation:
        flameMove .15s infinite alternate,
        flameGlow 1s infinite alternate;
    }

    @keyframes flameMove{

      from{
        transform:
          rotate(-3deg)
          scale(1);
      }

      to{
        transform:
          rotate(3deg)
          scale(1.08);
      }
    }

    @keyframes flameGlow{

      from{
        filter:
          blur(.5px)
          drop-shadow(0 0 10px orange);
      }

      to{
        filter:
          blur(1px)
          drop-shadow(0 0 30px gold);
      }
    }

    /* TYPING */

    .typing{
      border-right:2px solid white;
      white-space:pre-line;
      overflow:hidden;
      animation:blink .7s infinite;
    }

    @keyframes blink{
      50%{
        border-color:transparent;
      }
    }

  </style>
</head>

<body>

  <div class="cursor"></div>

  <audio id="birthdayMusic" loop>
    <source src="./assets/birthday.mp3" type="audio/mp3">
  </audio>

  <div class="circle circle1"></div>
  <div class="circle circle2"></div>
  <div class="circle circle3"></div>

  <div class="ribbon">
    ✨ HAPPY BIRTHDAY ✨
  </div>

  <div class="floating-name">
    Happy Birthday Siddhi ✨
  </div>

  <div class="scene">

    <div class="card" id="card">

      <div class="step">
        STEP 1 OF 5
      </div>

      <div class="emoji">
        🎵
      </div>

      <div class="title">
        Play the Music
      </div>

      <div class="desc">
        Every celebration deserves beautiful music
        and magical memories ✨
      </div>

      <button onclick="nextStep()">
        Start Surprise ✨
      </button>

    </div>

  </div>

  <!-- PREMIUM CAKE -->

  <div class="cake-effect" id="cakeEffect">

    <div class="cake-body"></div>

    <div class="cake-layer"></div>

    <div class="cake-candle"></div>

    <div class="flame"></div>

  </div>

  <script>

    const cursor=document.querySelector('.cursor');

    document.addEventListener('mousemove',(e)=>{

      cursor.style.left=e.clientX+'px';
      cursor.style.top=e.clientY+'px';

    });

    /* PARTICLES */

    for(let i=0;i<40;i++){

      const p=document.createElement('div');

      p.className='particle';

      p.style.left=Math.random()*100+'%';

      p.style.animationDuration=
        (10+Math.random()*20)+'s';

      document.body.appendChild(p);
    }

    /* STARS */

    for(let i=0;i<100;i++){

      const s=document.createElement('div');

      s.className='star';

      s.style.width=
      s.style.height=
      Math.random()*3+'px';

      s.style.left=Math.random()*100+'%';

      s.style.top=Math.random()*100+'%';

      s.style.animationDuration=
      (1+Math.random()*3)+'s';

      document.body.appendChild(s);
    }

    /* PHOTOS */

    const photos=[

      './assets/image1.jpeg',
      './assets/image2.jpeg',
      './assets/image3.jpeg',
      './assets/image4.jpeg',
      './assets/image5.jpeg',
      './assets/image6.jpeg',
      './assets/image7.jpeg',
      './assets/image8.jpeg',
      './assets/image9.jpeg',
      './assets/image10.jpeg',
      './assets/image11.jpeg'

    ];

    let current=1;

    const steps=[

      {
        emoji:'🎵',
        title:'Play the Music',
        desc:'Every celebration deserves beautiful music ✨',
        btn:'Continue 🎶'
      },

      {
        emoji:'🎀',
        title:'Decorate the Banner',
        desc:'Flowers and memories are falling beautifully 🌸',
        btn:'Decorate 🎀'
      },

      {
        emoji:'🎈',
        title:'Release Balloons',
        desc:'Luxury balloons floating through the dreamy sky 🎈',
        btn:'Release 🎈'
      },

      {
        emoji:'🎂',
        title:'Reveal the Cake',
        desc:'A magical premium cake appears ✨',
        btn:'Reveal Cake 🍰'
      },

      {
        emoji:'💌',
        title:'Birthday Message',
        desc:'A heartfelt birthday wish ✨',
        btn:'Open Message ✨'
      }

    ];

    function nextStep(){

      if(current === 1){

        document.getElementById("birthdayMusic").play();

      }

      if(current === 2){

        flowerRain();
        butterflies();

      }

      if(current === 3){

        floatingBalloons();

      }

      /* STEP 4 CAKE */

      if(current === 4){

        document
          .getElementById('cakeEffect')
          .classList.add('show');

      }

      if(current < steps.length){

        const step=steps[current];

        document.getElementById('card').innerHTML=`

          <div class="step">
            STEP ${current+1} OF 5
          </div>

          <div class="emoji">
            ${step.emoji}
          </div>

          <div class="title">
            ${step.title}
          </div>

          <div class="desc">
            ${step.desc}
          </div>

          <button onclick="nextStep()">
            ${step.btn}
          </button>

        `;

      }else{

        confetti({
          particleCount:250,
          spread:180
        });

        document.getElementById('card').innerHTML=`

          <div class="emoji">
            ✨
          </div>

          <div class="title">
            Happy Birthday
          </div>

          <div class="desc typing" id="typingText"></div>

        `;

        typeMessage();
      }

      current++;
    }

    /* TYPING */

    function typeMessage(){

      const text=`
Wishing you endless happiness,
beautiful memories,
success and magical moments ✨

May your smile always shine brighter
than the stars in the sky 🌸

Stay happy,
keep smiling
and enjoy your beautiful day ✨
      `;

      let i=0;

      const target=
      document.getElementById('typingText');

      const interval=setInterval(()=>{

        target.innerHTML += text.charAt(i);

        i++;

        if(i >= text.length){

          clearInterval(interval);
        }

      },45);
    }

    /* FALLING PHOTOS */

    function fallingPhotos(){

      setInterval(()=>{

        const p=document.createElement('div');

        p.className='photo';

        const randomPhoto=
        photos[Math.floor(Math.random()*photos.length)];

        p.innerHTML=`
          <img src="${randomPhoto}">
        `;

        p.style.left=Math.random()*100+'%';

        p.style.animationDuration=
        (12+Math.random()*8)+'s';

        document.body.appendChild(p);

        setTimeout(()=>{
          p.remove();
        },22000);

      },450);
    }

    fallingPhotos();

    /* FLOWERS */

    function flowerRain(){

      setInterval(()=>{

        const f=document.createElement('div');

        f.className='flower';

        const flowers=['🌸','🌺','💮','🌷'];

        f.innerHTML=
          flowers[Math.floor(Math.random()*flowers.length)];

        f.style.left=Math.random()*100+'%';

        f.style.animationDuration=
          (5+Math.random()*5)+'s';

        document.body.appendChild(f);

        setTimeout(()=>{
          f.remove();
        },10000);

      },250);
    }

    /* BALLOONS */

    function floatingBalloons(){

      setInterval(()=>{

        const b=document.createElement('div');

        b.className='balloon';

        b.innerHTML='🎈';

        b.style.left=Math.random()*100+'%';

        b.style.animationDuration=
        (8+Math.random()*8)+'s';

        document.body.appendChild(b);

        setTimeout(()=>{
          b.remove();
        },16000);

      },700);
    }

    /* BUTTERFLIES */

    function butterflies(){

      setInterval(()=>{

        const b=document.createElement('div');

        b.className='butterfly';

        b.innerHTML='🦋';

        b.style.left='-50px';

        b.style.top=Math.random()*80+'%';

        b.style.fontSize=
          (20+Math.random()*20)+'px';

        b.style.animation=
          'butterflyMove 12s linear forwards';

        document.body.appendChild(b);

        setTimeout(()=>{
          b.remove();
        },12000);

      },2500);
    }

  </script>

</body>

</html>
